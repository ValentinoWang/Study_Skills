name: Publish software engineering two-hour course

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-software-engineering-course.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
          git rev-parse HEAD
      - name: Generate canonical lesson and mirrors
        run: |
          cd repo
          python3 tools/import-software-engineering-course.py
          python3 tools/backwash-term-gates.py --check
          python3 tools/build-lessons.py --check
          python3 tools/check-lesson-consistency.py
          python3 tools/check-term-depth.py
          python3 tools/check-term-gate.py
          python3 tools/check-math-render-safety.py
      - name: Commit generated publication files to main
        run: |
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/learning-page-design-publisher/lessons/software-engineering-two-hour-primer-20260913.json \
                  skills/learning-page-design-publisher/term-overrides.yml \
                  docs/_data/lessons/software-engineering-two-hour-primer-20260913.json \
                  docs/_data/term_overrides.yml \
                  docs/lessons/software-engineering-two-hour-primer-20260913.html \
                  docs/index.html \
                  docs/_layouts/lesson.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'docs: publish two-hour software engineering primer'
            git push origin HEAD:main
          fi
