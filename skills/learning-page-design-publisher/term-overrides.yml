frontend-fast-feedback-pipeline-20260910:
  checklist: "我能解释 Runtime、Vite Development Server、HMR、Hot Reload、Incremental Compilation、Mock API、API Proxy、Target Runtime、Production Build、Docker Build、E2E 与 Deployment Readback 分别证明什么。"
  html: |
    <p><strong>先认词：</strong>这一课的重点是把开发反馈和发布证明分层。先认清下面这些词，再讨论“什么时候该跑重任务”。</p>
    <div class="grid">
      <details><summary>Runtime · 运行时<span class="term-gloss">程序真正执行代码、维护状态并调用平台能力的环境。</span></summary><div class="body"><dl><dt>直觉</dt><dd>源码像剧本，Runtime 是真正演出的舞台。</dd><dt>边界</dt><dd>浏览器、Flutter Debug Runtime、微信小程序运行环境都属于 Runtime；它不是发布包。</dd></dl></div></details>
      <details><summary>Vite Development Server · Vite 开发服务器<span class="term-gloss">专门服务开发态前端并把源码变化快速送到浏览器的服务器。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>React/Vue/uni-app H5 日常预览优先复用 dev server，而不是每次做 production build。</dd></dl></div></details>
      <details><summary>Hot Module Replacement (HMR) · 热模块替换<span class="term-gloss">应用不整体重启，只替换发生变化的前端模块。</span></summary><div class="body"><dl><dt>边界</dt><dd>HMR 证明开发态反馈快，不证明生产构建和目标平台已经正确。</dd></dl></div></details>
      <details><summary>Hot Reload · 热重载<span class="term-gloss">把新代码注入正在运行的调试应用，并尽量保留页面状态。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>Flutter 常用 Hot Reload 做 UI 与 Dart 逻辑的快速反馈。</dd></dl></div></details>
      <details><summary>Incremental Compilation · 增量编译<span class="term-gloss">只重新处理本次变化及其受影响依赖，而不是全量重建。</span></summary><div class="body"><dl><dt>直觉</dt><dd>只重印改过的章节，不重新印整本书。</dd></dl></div></details>
      <details><summary>Mock API · 模拟接口<span class="term-gloss">用可控假响应代替真实后端，稳定复现成功、空态与错误态。</span></summary><div class="body"><dl><dt>边界</dt><dd>Mock 能验证前端逻辑，但不能冒充真实后端联调。</dd></dl></div></details>
      <details><summary>API Proxy · 接口代理<span class="term-gloss">开发服务器把 /api 请求转发到本地、测试或受控远端后端。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>它让本地前端不用重建生产包就能连接真实 API。</dd></dl></div></details>
      <details><summary>Target Runtime · 目标平台运行时<span class="term-gloss">真正具有微信、Android、iOS 等平台生命周期、权限与原生 API 的环境。</span></summary><div class="body"><dl><dt>边界</dt><dd>Chrome 正常不能自动推出微信或手机原生能力正常。</dd></dl></div></details>
      <details><summary>Production Build · 生产构建<span class="term-gloss">生成准备正式交付给用户的优化发布产物。</span></summary><div class="body"><dl><dt>边界</dt><dd>普通 UI 小改不必每次运行；候选或发布节点必须证明它能成功生成。</dd></dl></div></details>
      <details><summary>Docker Build · 容器镜像构建<span class="term-gloss">按 Dockerfile 把程序、依赖和运行环境组装成可部署镜像。</span></summary><div class="body"><dl><dt>边界</dt><dd>它属于交付与环境一致性层，不是普通前端预览默认前置。</dd></dl></div></details>
      <details><summary>End-to-End Testing (E2E) · 端到端测试<span class="term-gloss">从真实入口跨过多个组件验证完整用户链路。</span></summary><div class="body"><dl><dt>边界</dt><dd>E2E 成本高，日常优先跑受影响链路，合并/发布再扩大范围。</dd></dl></div></details>
      <details><summary>Deployment Readback · 部署读回<span class="term-gloss">发布后从真实线上环境重新读取版本、页面、接口或健康状态。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>它证明“刚验收的候选确实在线”，而不是只相信部署命令返回成功。</dd></dl></div></details>
    </div>

software-delivery-lifecycle-ai-coding-20260910:
  checklist: "我能用自己的话解释 AI Agent、Software Delivery Lifecycle、Feedback Loop、HMR、Smoke Test、QA/Verification、E2E、Release Candidate、Acceptance、UAT、CI、Continuous Delivery/Deployment、Artifact、Observability 与 Rollback，并说清它们各自证明什么、不能证明什么。"
  html: |
    <p><strong>先认词：</strong>这一课不把术语当成一排缩写。每个词都按“直觉 → 严格定义 → 当前案例 → 边界”展开；先建立这些最小概念闭包，再讨论 AI Coding 时代怎样把人从重复点击中解放出来。</p>
    <div class="grid">
      <details><summary>AI Agent · 人工智能代理<span class="term-gloss">能围绕目标连续读取状态、调用工具、修改产物、运行检查并整理证据的自动执行者。</span></summary><div class="body"><dl><dt>直觉</dt><dd>它不是“更会聊天的搜索框”，而像一个能接任务、查资料、改代码、跑命令、根据结果继续行动的数字同事。</dd><dt>严格定义</dt><dd>在工程上下文里，AI Agent 通常由模型、上下文、工具接口、状态记录和停止条件组成；它根据当前观察选择下一步动作，并把外部工具返回的结果重新纳入决策。关键不是“会生成文字”，而是能形成多步的 observe → act → verify 循环。</dd><dt>当前案例</dt><dd>在软件交付中，Agent 可以先读需求和验收标准，再修改代码、运行测试、抓浏览器证据、整理失败原因和候选摘要；人不需要陪它逐个点击按钮。</dd><dt>边界</dt><dd>Agent 的自述不是独立证据。它可能误读目标、漏测边界或错误解释日志，所以关键结论仍要绑定可复现测试、构建产物、浏览器读回或有权主体的验收。</dd></dl></div></details>
      <details><summary>Software Delivery Lifecycle · 软件交付生命周期<span class="term-gloss">一项软件改动从意图和需求，经过实现、验证、构建、验收、发布，到运行反馈与恢复的完整路径。</span></summary><div class="body"><dl><dt>直觉</dt><dd>写完代码只是“做出零件”，Delivery Lifecycle 关心的是这个零件怎样被证明可靠、被正式接收、送到线上，并在出问题时能被发现和恢复。</dd><dt>严格定义</dt><dd>它是一组跨阶段状态转换与证据累积过程：需求定义可验收条件，实现产生候选变化，验证建立技术证据，构建形成不可变产物，验收完成授权，部署改变运行环境，观测与恢复闭合线上反馈。它比某一条 CI 脚本或部署命令更上位。</dd><dt>当前案例</dt><dd>当你问“前端小改要不要 Docker”“Playwright 什么时候跑全量”“谁来点最终确认”，都应该先判断当前改动处于生命周期哪个阶段，而不是把所有步骤塞进一条重流水线。</dd><dt>边界</dt><dd>不要把 Software Delivery Lifecycle 和 Software Development Life Cycle 完全等同。后者常覆盖需求、设计、开发、维护等更广的软件生命周期；前者更聚焦“怎样把变化可靠地交付为运行结果”。</dd></dl></div></details>
      <details><summary>Feedback Loop · 开发反馈循环<span class="term-gloss">从“做了一次修改”到“得到足以判断这次修改对不对的反馈”所经历的闭环。</span></summary><div class="body"><dl><dt>直觉</dt><dd>你改一个按钮文案，如果两秒后就能看到页面，错误很便宜；如果每次都要等十分钟 Docker build，开发者就会减少验证次数，错误反而更容易积累。</dd><dt>严格定义</dt><dd>可把单次反馈成本抽象为 T_feedback = T_prepare + T_execute + T_observe + T_decide。日常工程优化的目标不是让所有验证都消失，而是让当前改动只支付“足够证明它”的最小成本，同时保留后续更重的候选和发布门禁。</dd><dt>当前案例</dt><dd>前端样式修改优先走 HMR；接口映射改动跑定向 API/浏览器测试；只有进入候选或发布时才扩大到 production build、完整 E2E 和部署读回。</dd><dt>边界</dt><dd>反馈快不等于证据强。一个页面即时刷新只能证明开发态的局部行为，不能自动推出生产构建、跨浏览器、权限、数据库迁移或线上部署正确。</dd></dl></div></details>
      <details><summary>Hot Module Replacement (HMR) · 热模块替换<span class="term-gloss">开发服务器只把发生变化的前端模块替换进正在运行的页面，而不是每次整体重启或重新构建发布包。</span></summary><div class="body"><dl><dt>直觉</dt><dd>像机器不停机，只换掉刚改动的那个零件；因此你保存代码后能很快看到界面更新。</dd><dt>严格定义</dt><dd>HMR 依赖开发服务器维护模块依赖图，检测源码变化后重新转换受影响模块，并通过开发连接通知浏览器替换模块。框架还可能在模块边界上保留组件状态，但状态是否保留取决于具体实现。</dd><dt>当前案例</dt><dd>React/Vue/Vite 日常 UI 开发可以一直保持 dev server 运行，让 AI 或人快速验证页面、文案和普通交互，不需要每次生成生产静态包或 Docker 镜像。</dd><dt>边界</dt><dd>HMR 是开发反馈机制，不是发布证明。构建配置、tree-shaking、生产环境变量、服务端嵌入、目标平台 Runtime 等问题仍要在更高层验证。</dd></dl></div></details>
      <details><summary>Smoke Test · 冒烟测试<span class="term-gloss">用少量最关键检查快速判断系统有没有“基本活着”，以及主路径是否发生明显破坏。</span></summary><div class="body"><dl><dt>直觉</dt><dd>先启动机器闻一闻有没有冒烟；不是拆开每个零件检查，而是先判断值不值得继续做更细验证。</dd><dt>严格定义</dt><dd>Smoke Test 是覆盖面窄、成本低、失败信号强的一组测试，通常选择启动、健康接口、登录入口、关键 API 或主页面等最低生存条件。它常位于更完整回归测试之前。</dd><dt>当前案例</dt><dd>AI 改完页面后可以先确认 dev server 可访问、关键路由 200、核心 API 返回基本结构，再决定是否运行定向 Playwright 或完整候选验证。</dd><dt>边界</dt><dd>冒烟测试通过只说明“没有立刻发现致命问题”，不能推出边界条件、权限矩阵、异常路径和跨组件一致性已经验证。</dd></dl></div></details>
      <details><summary>Quality Assurance / Verification (QA) · 质量保证 / 技术验证<span class="term-gloss">用可复现检查和证据验证预先定义的技术条件是否成立。</span></summary><div class="body"><dl><dt>直觉</dt><dd>QA 回答的是“我们约定要检查的技术条件，机器和证据是否真的证明它们通过了”。</dd><dt>严格定义</dt><dd>Verification 更强调“产物是否符合规格和合同”，QA 是更广的质量活动集合，可包含单元测试、集成测试、静态分析、契约检查、安全检查、浏览器测试、构建验证和结果审计。关键特征是标准预先定义且结果可重复。</dd><dt>当前案例</dt><dd>在 AI Coding 流程中，Agent 可以执行大量 QA，但证据最好由独立命令、CI、测试报告、截图或结构化 payload 产生，而不是只保留 Agent 的自然语言结论。</dd><dt>边界</dt><dd>QA 通过不等于 Acceptance。前者证明“条件通过”，后者还涉及“谁有权接受、风险是否可承担、这个具体候选是否被授权进入下一阶段”。</dd></dl></div></details>
      <details><summary>End-to-End Testing (E2E) · 端到端测试<span class="term-gloss">从真实或接近真实的用户入口出发，跨越多个组件验证一条完整业务链路。</span></summary><div class="body"><dl><dt>直觉</dt><dd>单元测试像测发动机零件，E2E 是把整辆车从起点真的开到终点，观察前端、网络、后端和数据能否协同工作。</dd><dt>严格定义</dt><dd>E2E 测试通常跨越浏览器/UI、网络请求、鉴权、应用服务和持久化等多个边界，以最终用户可观察结果作为断言。它覆盖真实集成风险更强，但运行更慢、环境依赖更多、失败定位成本也更高。</dd><dt>当前案例</dt><dd>例如测试“普通用户登录 → 创建记录 → 页面读回 → 权限正确”，就比只测一个 React 组件或单个 API 更接近真实业务闭环。</dd><dt>边界</dt><dd>E2E 不应该替代所有低层测试。若把每个小逻辑都塞进浏览器全链路，反馈会变慢且失败难定位；更合理的是测试金字塔/测试分层与风险驱动选择。</dd></dl></div></details>
      <details><summary>Release Candidate · 发布候选<span class="term-gloss">准备进入最终验收或发布的一个冻结对象，通常绑定确定 commit、构建产物和对应证据。</span></summary><div class="body"><dl><dt>直觉</dt><dd>它像“送审稿”：不是随时还在变化的工作区，而是一个可以明确回答“我们正在验哪一版”的对象。</dd><dt>严格定义</dt><dd>Release Candidate 应具有稳定身份，例如 source commit SHA、artifact digest、配置版本和验收证据集合。候选形成后，若继续修改代码或重新构建出不同字节，应视为新的候选并重新计算受影响验证。</dd><dt>当前案例</dt><dd>AI 完成开发与 QA 后，把 commit、Docker image digest、测试报告、迁移状态和已知风险打包成候选，人类验收的是这个具体对象，而不是“最新代码”这种不断漂移的概念。</dd><dt>边界</dt><dd>候选不等于已发布，更不等于已验收。它只是把对象冻结下来，让后续 Acceptance 和 Deployment 有明确指向。</dd></dl></div></details>
      <details><summary>Acceptance · 验收接受<span class="term-gloss">有权主体基于验收标准和证据，对一个明确候选作出接受或拒绝的治理决定。</span></summary><div class="body"><dl><dt>直觉</dt><dd>机器可以把检查做完，但“这版可以进入下一阶段吗”最终是一个带权限和责任的决定。</dd><dt>严格定义</dt><dd>Acceptance 至少需要验收对象、验收标准、证据、决策主体和结果记录。它把技术验证转换成组织授权，例如 ACCEPTED / REJECTED，并让后续发布能够追溯“谁基于什么证据接受了哪一版”。</dd><dt>当前案例</dt><dd>如果 AI 已经跑完 200 个可重复检查，人类不需要重新点 200 次；更合理的是复核高风险语义、证据完整性和例外项，再对候选 payload 作接受决定。</dd><dt>边界</dt><dd>Acceptance 不是“随便看两眼觉得行”，也不是 QA 的同义词。它尤其不能在候选对象发生变化后继续沿用旧的接受记录。</dd></dl></div></details>
      <details><summary>User Acceptance Testing (UAT) · 用户验收测试<span class="term-gloss">从业务用户或真实使用者视角验证软件是否满足约定用途和业务验收条件。</span></summary><div class="body"><dl><dt>直觉</dt><dd>技术测试可能证明按钮能点、接口能回，但 UAT 更关心“业务人员按真实工作方式使用时，这是不是他们真正要的东西”。</dd><dt>严格定义</dt><dd>UAT 通常基于业务场景、角色、规则和可接受结果执行，关注需求语义和使用目标，而不是只检查内部实现。它可以由真实用户、产品负责人或被授权的业务代表参与。</dd><dt>当前案例</dt><dd>例如运动训练 SaaS 中，测试“教练发布训练 → 运动员收到 → 反馈 → 教练复核”的业务闭环，比单测一个 API 更接近 UAT。</dd><dt>边界</dt><dd>UAT 不等于把所有技术测试再人工执行一次；性能、安全、边界输入、浏览器兼容等仍应主要由专业 QA 和自动化覆盖。</dd></dl></div></details>
      <details><summary>Continuous Integration (CI) · 持续集成<span class="term-gloss">代码变化被频繁集成到共享主线，并由统一自动化检查尽早验证兼容性和质量。</span></summary><div class="body"><dl><dt>直觉</dt><dd>不要让每个人在自己的分支里攒一个月再一次性合并；小步集成、持续检查，冲突和错误会更早暴露。</dd><dt>严格定义</dt><dd>CI 通常围绕共享版本库触发自动构建、测试、静态分析、契约检查等门禁，使每次候选变化都能获得一致的验证环境和结果。核心价值是降低集成风险，而不是某个具体 CI 平台。</dd><dt>当前案例</dt><dd>Agent 本地声称测试通过后，远端 CI 再在干净环境重跑关键门禁，可以发现本机缓存、未提交文件、环境变量或依赖漂移造成的假阳性。</dd><dt>边界</dt><dd>CI 不等于 CD，也不自动部署生产。CI 的主要问题是“变化能否安全集成”，不是“是否已经获得发布授权”。</dd></dl></div></details>
      <details><summary>Continuous Delivery / Deployment (CD) · 持续交付 / 持续部署<span class="term-gloss">把通过验证的变化持续推进到可发布状态；若进一步自动进入生产，则属于持续部署。</span></summary><div class="body"><dl><dt>直觉</dt><dd>Continuous Delivery 是“随时可以可靠上线”，Continuous Deployment 是“满足规则后自动上线”。两者自动化程度相近，但最后一道发布门不同。</dd><dt>严格定义</dt><dd>持续交付通过标准化构建、环境推广、配置管理和验收门，让候选稳定地到达“可发布”状态；持续部署则把生产部署也纳入自动状态转换。两者都要求过程可重复、可追溯、可恢复。</dd><dt>当前案例</dt><dd>低风险文档站可以在主线门禁通过后自动部署；支付、数据库高风险变更可以保留人工 Acceptance，再由同一候选 artifact 推进生产。</dd><dt>边界</dt><dd>CD 不是“所有东西必须无人值守”。风险越高，越可能保留授权门；但即使有人工门，也应避免手工拼装和不可重复部署。</dd></dl></div></details>
      <details><summary>Artifact · 构建产物<span class="term-gloss">从确定源码和构建过程产生、可被版本化和部署的具体输出，例如镜像、二进制或静态站点包。</span></summary><div class="body"><dl><dt>直觉</dt><dd>源码是菜谱，Artifact 是已经做出来、准备端上桌的那盘菜；部署的是后者，不是抽象的 Git 分支名。</dd><dt>严格定义</dt><dd>理想 artifact 具有不可变身份，例如文件哈希或容器 image digest，并能追溯到 source commit、构建环境和依赖版本。这样验收对象与部署对象之间可以建立明确映射。</dd><dt>当前案例</dt><dd>若候选 Docker 镜像已经通过测试和验收，生产环境应部署同一个 digest，而不是上线前重新在服务器执行一次 build，产生可能不同的新镜像。</dd><dt>边界</dt><dd>Artifact identity 只证明“这是同一份字节”，不自动证明它业务正确；仍需 QA、Acceptance 和运行读回形成完整证据链。</dd></dl></div></details>
      <details><summary>Observability · 可观测性<span class="term-gloss">通过日志、指标、追踪和业务信号，从系统外部输出推断内部运行状态与故障位置的能力。</span></summary><div class="body"><dl><dt>直觉</dt><dd>上线后不能只问“进程还在不在”，而要能回答用户是否成功、哪里变慢、哪类请求失败、问题从什么时候开始。</dd><dt>严格定义</dt><dd>工程可观测性通常结合 logs、metrics、traces 与业务 SLI，通过可关联的请求 ID、版本信息和时间序列把症状映射到组件、依赖和发布事件。它强调能从输出解释系统状态，而不仅是收集很多日志。</dd><dt>当前案例</dt><dd>一次发布后，AI 可以对比错误率、延迟、关键 API 成功率和版本标签；若某个指标越过阈值，再把证据交给人决定是否继续观察或回滚。</dd><dt>边界</dt><dd>有日志不等于有可观测性。若日志没有版本、请求关联和关键业务信号，数据很多也可能无法快速定位问题。</dd></dl></div></details>
      <details><summary>Rollback · 回滚<span class="term-gloss">当新版本造成不可接受风险时，把运行系统恢复到已知安全状态的受控恢复动作。</span></summary><div class="body"><dl><dt>直觉</dt><dd>发布不是只能向前冲；真正可靠的交付系统还要准备一条“出问题时怎么快速回到安全位置”的路。</dd><dt>严格定义</dt><dd>Rollback 可以表现为切回旧 artifact、恢复旧配置、流量回切或执行兼容的数据恢复策略。是否可回滚取决于状态变化是否可逆，尤其数据库 schema、数据迁移和外部副作用可能让简单二进制回退失效。</dd><dt>当前案例</dt><dd>若新镜像上线后错误率异常，部署系统可把流量切回上一个已验收 digest；如果本次还做了不可逆数据迁移，则必须按预先设计的恢复方案处理，而不是只重启旧容器。</dd><dt>边界</dt><dd>Rollback 不是所有故障的万能按钮。没有向后兼容 schema、备份或幂等外部操作时，代码版本回退并不能自动恢复业务状态。</dd></dl></div></details>
    </div>

git-three-state-divergence-20260831:
  checklist: "我能区分 Commit/SHA、Blob Object ID、Branch、HEAD、git fetch、origin/main、git checkout、Working Tree、Git worktree、ahead/behind、Fast-forward 与 Merge Conflict，并理解 blob 指纹只证明字节身份。"
  html: |
    <p><strong>先认词：</strong>这一课最容易卡住的不是命令，而是把对象身份、引用位置、工作目录状态和真实运行版本混成“代码版本”。</p>
    <div class="grid">
      <details><summary>Commit / SHA · 提交 / 提交哈希<span class="term-gloss">Commit 是封存的一版历史；它由 Git 对象 ID 标识，传统 SHA-1 仓库常简称为 SHA。</span></summary><div class="body"><dl><dt>直觉</dt><dd>Commit 像存档点，对象 ID 像这个存档点的内容寻址标识。</dd><dt>边界</dt><dd>现代 Git 也支持 SHA-256 对象格式，所以“SHA”是常见口语，严格概念是 Object ID。</dd></dl></div></details>
      <details><summary>Blob Object ID (OID) · 内容寻址指纹<span class="term-gloss">Git 根据文件字节内容生成 blob 对象 ID；它证明内容身份，不证明页面或业务正确。</span></summary><div class="body"><dl><dt>直觉</dt><dd>blob OID 可以理解成“这段精确文件字节在 Git 对象库里的身份证”。内容一模一样时，不同路径可以复用同一个 blob。</dd><dt>严格定义</dt><dd>对文件字节 x，可抽象为 <code>OID_blob = H(&quot;blob &quot; || len(x) || NUL || x)</code>。传统 Git 对象格式使用 SHA-1，Git 也支持 SHA-256 对象格式；文件名和路径不在 blob 中，而由 tree 把 mode、name 与 blob OID 关联。</dd><dt>怎么观察</dt><dd><pre><code>git hash-object path/to/file&#10;git rev-parse HEAD:path/to/file&#10;git cat-file -t &lt;OID&gt;&#10;git cat-file -p &lt;OID&gt;&#10;git ls-tree HEAD path/to/file</code></pre>前两条可以计算/读取 blob OID，<code>cat-file</code> 查看对象类型或内容，<code>ls-tree</code> 则能看到路径名如何由 tree 指向 blob。</dd><dt>边界</dt><dd>相同 blob OID 能证明两份对象的字节身份一致，却不能证明这些字节满足业务语义，也不能证明浏览器渲染正确。应区分 Artifact Identity、Semantic Correctness 与 Rendered Correctness。</dd><dt>当前案例</dt><dd>之前 <code>docs/lessons</code> 与 <code>examples</code> 可以拥有同一个 HTML blob OID，但两边包含的是同一个会破坏 MathML 的 CSS，因此它们是“一致地错误”。这正说明 blob/hash consistency 只能作为身份门禁，不能替代 Chromium 等真实 Runtime 的渲染 QA。</dd></dl></div></details>
      <details><summary>Branch · 分支<span class="term-gloss">指向某个提交、会随着新提交向前移动的引用。</span></summary><div class="body"><dl><dt>直觉</dt><dd>它像贴在提交历史上的可移动书签。</dd></dl></div></details>
      <details><summary>HEAD · 当前检出位置<span class="term-gloss">表示当前 Git 工作目录“我现在站在哪个分支或提交上”。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>服务器 HEAD 停在旧提交时，fetch 最新 origin/main 也不会自动切换工作目录。</dd></dl></div></details>
      <details><summary>git fetch · 获取远端信息<span class="term-gloss">下载远端新对象并更新远程跟踪引用，但通常不改变当前 Working Tree。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>fetch 后本地可以知道 origin/main 最新位置，但 HEAD 不会自动跟过去。</dd></dl></div></details>
      <details><summary>origin/main · 远程跟踪引用<span class="term-gloss">本地记录的“最近一次看到远端 main 在哪里”的指针。</span></summary><div class="body"><dl><dt>边界</dt><dd>它是一份本地远端认知，不是当前 checkout，也不是远端服务器本身。</dd></dl></div></details>
      <details><summary>git checkout · 检出 / 切换<span class="term-gloss">让某个工作目录真正摊开指定分支或提交对应的文件。</span></summary><div class="body"><dl><dt>边界</dt><dd>知道 origin/main 在哪里，与把当前工作目录 checkout 到那里是两回事。</dd></dl></div></details>
      <details><summary>Working Tree · 工作树<span class="term-gloss">当前工作目录实际摊开的文件，以及相对索引/HEAD 尚未提交的变化。</span></summary><div class="body"><dl><dt>边界</dt><dd>clean 只表示没有未提交变化，不表示 HEAD 是最新版。</dd></dl></div></details>
      <details><summary>Git worktree · Git 额外工作目录<span class="term-gloss">让同一个对象库同时拥有多个独立 checkout 工作目录。</span></summary><div class="body"><dl><dt>边界</dt><dd>Git worktree 是机制名；Working Tree 是某个 checkout 当前摊开的文件状态。</dd></dl></div></details>
      <details><summary>ahead / behind · 领先 / 落后<span class="term-gloss">比较两个 refs 的可达提交集合，统计双方各自独有的提交数量。</span></summary><div class="body"><dl><dt>严格定义</dt><dd>它是成对比较关系，不是一个分支的绝对属性；本质上接近 Reach(A) 与 Reach(B) 的集合差计数。</dd></dl></div></details>
      <details><summary>Fast-forward Merge · 快进合并<span class="term-gloss">目标历史包含当前历史时，只移动引用就能完成合并。</span></summary><div class="body"><dl><dt>边界</dt><dd>两边都产生独有提交后，就不能只靠快进。</dd></dl></div></details>
      <details><summary>Merge Conflict · 合并冲突<span class="term-gloss">双方修改无法被 Git 自动组合时，需要人或规则判断最终语义。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>冲突数量说明自动合并受阻，不代表某一边天然“错”。</dd></dl></div></details>
    </div>

tencent-cloud-dns-icp-mainland-origin-20260831:
  checklist: "我能解释 DNS、A/AAAA/CNAME/TTL、TCP/443、TLS/HTTPS、SNI、HTTP Host/Reverse Proxy、API、CVM、域名实名认证、ICP 备案/接入备案、Origin/同源策略、CORS、Health Check/Observability 各自在哪一层工作，以及一层通过为什么不能推出下一层通过。"
  html: |
    <p><strong>先认词：</strong>“域名打不开”只是一个表象。这里把真正参与排错的核心词按请求发生顺序展开：名称解析 → 网络连接 → 加密握手 → HTTP 路由 → 应用 → 浏览器安全 → 中国大陆接入合规。每张卡都包含直觉、严格定义、当前案例和边界。</p>
    <div class="grid">
      <details><summary>Domain Name System (DNS) · 域名系统 / DNS 解析<span class="term-gloss">把人类可读域名解析成地址或别名；它只负责“名字指向哪里”，不负责目标服务是否可用。</span></summary><div class="body"><dl><dt>直觉</dt><dd>DNS 像互联网电话簿：你输入 <code>api.example.com</code>，先要查到应该去哪个地址，再谈后面的连接、证书和应用。</dd><dt>严格定义</dt><dd>DNS 是分层、分布式名称系统。客户端通常把查询交给递归解析器，递归解析器根据缓存或继续查询根、顶级域与权威 DNS，最后返回 A、AAAA、CNAME 等资源记录及 TTL。权威 DNS 决定某个 zone 的正式答案。</dd><dt>当前案例</dt><dd>排查时先用 <code>dig</code> 或 <code>nslookup</code> 看不同递归解析器得到的答案。如果权威记录已改但部分客户端仍看到旧 IP，应先考虑 TTL、缓存和解析路径，而不是立刻怀疑 Nginx。</dd><dt>边界</dt><dd>DNS 正确只证明“名称层”成立。它不能证明 TCP 443 可达、TLS 证书匹配、反向代理命中正确站点、应用健康，也不能证明浏览器 CORS 或 ICP 接入条件满足。</dd></dl></div></details>
      <details><summary>DNS Resource Records: A / AAAA / CNAME / TTL · DNS 资源记录<span class="term-gloss">A/AAAA 把名称指向 IPv4/IPv6，CNAME 把名称别名到另一个域名，TTL 控制递归缓存可复用答案的时间。</span></summary><div class="body"><dl><dt>直觉</dt><dd>A 像写一个 IPv4 地址，AAAA 写 IPv6 地址，CNAME 写“请继续去查另一个名字”，TTL 则告诉中间缓存“这份答案大概可以保存多久”。</dd><dt>严格定义</dt><dd>A 与 AAAA 的 RDATA 分别承载 IPv4 和 IPv6 地址；CNAME 表示 canonical name 别名关系，解析器还需继续解析目标名称。TTL 是资源记录的缓存生存时间，不是修改后全球必然同步的精确倒计时。</dd><dt>当前案例</dt><dd>如果域名同时存在正确 A 与错误 AAAA，支持 IPv6 的用户可能走到错误服务器，而只走 IPv4 的用户一切正常；如果旧记录 TTL 很长，也会出现“有些地方已经好、有些地方仍打不开”。</dd><dt>边界</dt><dd>记录值正确不等于端口开放，更不等于 HTTPS 可用。CNAME 也不会“转发 HTTP 请求”，它只是改变名称解析链；真正的 HTTP 转发由后面的反向代理完成。</dd></dl></div></details>
      <details><summary>Transmission Control Protocol (TCP) / Port 443 · 传输控制协议 / 443 端口<span class="term-gloss">DNS 给出地址后，HTTPS 客户端通常先向目标的 TCP 443 建立可靠连接，连接成功后才进入 TLS。</span></summary><div class="body"><dl><dt>直觉</dt><dd>IP 像大楼地址，443 端口像具体门牌。你查到大楼在哪，并不代表 443 号门一定开着。</dd><dt>严格定义</dt><dd>TCP 是面向连接的可靠字节流传输协议，建立连接时需要完成握手并维护序号、确认和重传等状态。HTTPS 常使用 TCP 443；连接可能因安全组、防火墙、监听地址、路由或网络丢包出现 timeout 或 connection refused。</dd><dt>当前案例</dt><dd>可以用 <code>nc -vz host 443</code>、<code>curl -v</code> 或 TCP 探测区分“域名已经解析，但网络/端口根本连不上”和“TCP 已通、问题发生在 TLS/HTTP 上层”。</dd><dt>边界</dt><dd><code>ping</code> 主要观察 ICMP，不等价于 TCP 443。服务器可能禁止 ping 但 HTTPS 正常，也可能 ping 通而 443 被防火墙拦截。</dd></dl></div></details>
      <details><summary>Transport Layer Security (TLS) / HTTPS · 传输层安全 / 加密 HTTP<span class="term-gloss">TCP 建连后，通过证书、密钥协商和握手建立加密且可验证服务器身份的通道。</span></summary><div class="body"><dl><dt>直觉</dt><dd>TCP 只解决“门能不能打开”，TLS 继续确认“门后是不是我要找的那家服务，并建立一条别人难以偷听和篡改的加密通道”。</dd><dt>严格定义</dt><dd>TLS 握手协商协议版本与加密参数，服务器发送证书链证明域名身份，双方生成会话密钥后再承载加密的 HTTP。客户端还会校验证书有效期、信任链、主机名匹配等条件。</dd><dt>当前案例</dt><dd>DNS 指向正确 IP、443 也能连通，但浏览器报证书域名不匹配或链不可信，就应检查证书、SNI、反代 TLS 配置，而不是继续修改 DNS。</dd><dt>边界</dt><dd>TLS 成功只说明加密连接与身份校验这层成立，不代表 HTTP Host 路由、上游应用、数据库或业务响应正确。</dd></dl></div></details>
      <details><summary>Server Name Indication (SNI) · 服务器名称指示<span class="term-gloss">TLS 握手阶段客户端携带目标主机名，让同一 IP 上的服务器选择正确证书和虚拟站点。</span></summary><div class="body"><dl><dt>直觉</dt><dd>同一栋楼里住着很多公司，客户端在进门时先报“我要找 api.example.com”，前台才知道拿哪张证书和哪套配置。</dd><dt>严格定义</dt><dd>SNI 是 TLS ClientHello 中的扩展，允许客户端在加密 HTTP 内容发送前就声明目标 server name。服务器据此选择对应证书和 TLS 虚拟主机，因此一个公网 IP 可以承载多个 HTTPS 域名。</dd><dt>当前案例</dt><dd>直接访问 <code>https://IP</code> 可能拿到默认站点证书，而访问真实域名却正常；排查时应使用真实 hostname，或用 <code>curl --resolve</code> 在固定 IP 的同时保留正确的域名/SNI。</dd><dt>边界</dt><dd>SNI 发生在 TLS 层，不等于 HTTP Host。二者都可能含域名，但发生时间和作用不同：SNI 先选 TLS 身份，Host/:authority 再参与 HTTP 路由。</dd></dl></div></details>
      <details><summary>HTTP Host / Reverse Proxy · HTTP 主机路由 / 反向代理<span class="term-gloss">HTTP 请求携带目标主机名，Nginx/Caddy 等反向代理据此和路径规则把请求转发给内部应用。</span></summary><div class="body"><dl><dt>直觉</dt><dd>所有请求先到大楼总前台，前台看“你找哪家公司、哪个部门”，再把请求转给真正办业务的后端。</dd><dt>严格定义</dt><dd>HTTP/1.1 使用 Host，HTTP/2/3 使用 :authority 表示目标主机。反向代理可终止 TLS，并按主机、路径、Header 等匹配虚拟站点，把请求转发至 upstream；错误的 server_name、route 或 upstream 会表现为 404、502、默认站点等。</dd><dt>当前案例</dt><dd>若 TLS 正常但访问域名得到错误页面，可检查 Caddy/Nginx access log、Host 匹配和 upstream health；必要时通过固定 Host 请求判断是否命中了正确虚拟主机。</dd><dt>边界</dt><dd>反向代理“活着”不等于后端应用健康；502 可能是 upstream 不可达。反向代理也不是 DNS：DNS 决定先去哪台机器，反向代理决定请求到了这台机器后再去哪个内部服务。</dd></dl></div></details>
      <details><summary>Application Programming Interface (API) · 应用程序接口<span class="term-gloss">前端或其他程序按约定的 URL、方法、参数和响应结构调用后端能力的契约入口。</span></summary><div class="body"><dl><dt>直觉</dt><dd>网络和 TLS 只是把电话接通，API 才规定“你该说什么、服务器应该怎么回答”。</dd><dt>严格定义</dt><dd>HTTP API 通常由 endpoint、method、headers、request body、status code 与 response schema 构成契约。应用层还会处理鉴权、业务规则、数据库与其他依赖，因此 HTTP 能到达服务器不代表 API 语义正确。</dd><dt>当前案例</dt><dd>域名、443、TLS、反代都正常后，可以单独请求 <code>/health</code> 或具体 API，观察状态码、响应体和应用日志，继续区分路由错误、鉴权错误、数据库故障等。</dd><dt>边界</dt><dd>API 200 也不一定等于前端正常；浏览器还可能因为 CORS、前端解析错误或页面状态管理问题无法使用这个响应。</dd></dl></div></details>
      <details><summary>Cloud Virtual Machine (CVM) · 云服务器<span class="term-gloss">云厂商提供的虚拟计算主机，承载操作系统、反向代理、应用进程和网络安全配置。</span></summary><div class="body"><dl><dt>直觉</dt><dd>它可以理解成租来的远程 Linux 电脑；你能在上面运行 Caddy、Docker、数据库客户端和后端服务。</dd><dt>严格定义</dt><dd>CVM 是基础设施计算实例，具有地域/可用区、虚拟网卡、公网/私网地址、安全组、磁盘等资源。网络入口是否开放、服务监听在哪个地址、实例属于中国大陆还是境外地域都会改变访问与合规条件。</dd><dt>当前案例</dt><dd>当 origin 位于腾讯云中国大陆 CVM 时，除了检查进程和 443，还要把该实例所属接入商与 ICP 接入备案关系纳入排查；若迁移到境外实例，技术路径和合规条件又不同。</dd><dt>边界</dt><dd>“服务器在线”不等于某个域名已经指向它，也不等于对应端口可达。云主机只是承载环境，DNS、TLS、应用和备案是不同层。</dd></dl></div></details>
      <details><summary>Domain Real-name Verification · 域名实名认证<span class="term-gloss">验证域名注册持有者身份与注册信息，解决“这个域名是谁名下”的问题。</span></summary><div class="body"><dl><dt>直觉</dt><dd>像给房产证上的产权人做身份核验，它证明谁拥有/注册这个域名，但不等于这个地址上的网站已经获得互联网信息服务备案。</dd><dt>严格定义</dt><dd>域名实名认证属于域名注册管理环节，通常要求注册者信息满足实名要求。它与 DNS 解析、网站服务器部署和 ICP 备案分别属于不同管理/技术层次。</dd><dt>当前案例</dt><dd>如果控制台显示域名已实名，只能说明注册主体信息通过；当网站使用中国大陆服务器时，仍需单独核对 ICP 主体、网站备案以及当前接入商关系。</dd><dt>边界</dt><dd>“已实名”不能作为“已备案”的证据，也不能解释 TLS 或 HTTP 错误。排错时不要把身份登记和网络协议混为一层。</dd></dl></div></details>
      <details><summary>Internet Content Provider (ICP) Filing / Access Filing · ICP 备案 / 接入备案<span class="term-gloss">中国大陆互联网信息服务的备案与实际接入商关系管理；它是合规/接入条件，不是 DNS 协议的一部分。</span></summary><div class="body"><dl><dt>直觉</dt><dd>DNS 是告诉访客“店在哪里”，ICP备案/接入备案更像“这家店以这个主体在这个接入场地经营是否完成登记”。</dd><dt>严格定义</dt><dd>当网站或相关互联网信息服务使用中国大陆接入资源时，需要按现行规则完成相应 ICP 备案；已有备案号但更换或增加中国大陆接入商时，通常还涉及接入备案/接入信息维护。具体要求应以工信部和当前云厂商指引为准。</dd><dt>当前案例</dt><dd>域名已经在其他平台备案，但现在直接指向腾讯云中国大陆 CVM 时，应核对腾讯云是否已经成为对应接入商，而不是只查看域名实名认证或 DNS A 记录。</dd><dt>边界</dt><dd>这是合规与平台接入层，不应用技术绕路替代合规判断。备案正确也不能证明服务器进程、证书、反代或 API 健康。</dd></dl></div></details>
      <details><summary>Origin / Same-Origin Policy · 源 / 同源策略<span class="term-gloss">浏览器把 scheme、host、port 组合成“源”，并默认限制不同源页面脚本相互读取敏感资源。</span></summary><div class="body"><dl><dt>直觉</dt><dd>浏览器不仅问“请求能不能发出去”，还会问“这个页面有没有资格读取另一个地址返回的结果”。</dd><dt>严格定义</dt><dd>Web Origin 通常由协议、主机和端口三元组决定。只要其中关键部分不同，就可能成为跨源请求；Same-Origin Policy 是浏览器安全模型，用来限制一个源的脚本直接访问另一个源的受保护数据。</dd><dt>当前案例</dt><dd>GitHub Pages 页面在 <code>https://xxx.github.io</code>，API 在 <code>https://api.example.com</code>，二者 host 不同，因此浏览器会按跨源请求处理，即使 API 本身从命令行访问完全正常。</dd><dt>边界</dt><dd>同源策略主要由浏览器执行，不是服务器之间的网络 ACL。后端服务到后端服务的 HTTP 调用通常不受浏览器 SOP 约束。</dd></dl></div></details>
      <details><summary>Cross-Origin Resource Sharing (CORS) · 跨源资源共享<span class="term-gloss">服务端用特定 HTTP 响应头告诉浏览器：哪些跨源页面可以读取这个响应、允许哪些方法和请求头。</span></summary><div class="body"><dl><dt>直觉</dt><dd>API 已经把包裹送到浏览器，但浏览器收发室还会检查“发起这个请求的页面是否在允许领取名单里”。</dd><dt>严格定义</dt><dd>CORS 通过 <code>Access-Control-Allow-Origin</code>、允许方法和 headers 等响应信息放宽同源策略；某些非简单请求会先发送 OPTIONS preflight，只有预检通过后浏览器才继续实际请求或允许脚本读取结果。</dd><dt>当前案例</dt><dd>如果 <code>curl https://api.example.com/health</code> 成功，而网页控制台显示 CORS blocked，应查看 Origin、预检请求和响应头，而不是继续排查 DNS/TCP。</dd><dt>边界</dt><dd>CORS 不是认证系统，也不是服务器防火墙。允许某个 Origin 读取响应不代表用户获得业务权限；真正的鉴权仍需 token/session/权限规则。</dd></dl></div></details>
      <details><summary>Health Check / Observability · 健康检查 / 可观测性<span class="term-gloss">用专门端点和日志、指标等证据回答“请求到没到、服务哪一层活着、故障发生在哪里”。</span></summary><div class="body"><dl><dt>直觉</dt><dd>没有仪表时只能猜“可能是 DNS、可能是 Nginx”；有分层观测后，可以像做实验一样逐个测量每一层。</dd><dt>严格定义</dt><dd>Health Check 是针对进程或依赖暴露的明确健康信号，例如 liveness/readiness；Observability 则通过日志、指标、追踪、请求 ID 等输出帮助推断系统内部状态。排错时应从最小本机路径到公网、域名、浏览器逐层增加变量。</dd><dt>当前案例</dt><dd>先在服务器本机访问后端端口，再访问反代本机入口，再从公网 IP/域名请求，最后在浏览器复现；结合 access/error log，可以确定故障是在应用内部、反代、TLS、DNS 还是浏览器层。</dd><dt>边界</dt><dd><code>/health</code> 返回 200 只证明健康检查覆盖的部分。它不自动证明登录、支付、数据库写入或所有外部依赖正常，因此健康检查要明确自己证明的范围。</dd></dl></div></details>
    </div>

sub2api-hong-kong-ingress-network-path-20260910:
  checklist: "我能解释 Network Path、Ingress/Egress、Forward Proxy、Reverse Proxy、Origin Server、RTT、TTFB、TLS Termination、SSE、WebSocket、Proxy Buffering、WireGuard、System Proxy 与 TUN 在这条链路中的位置。"
  html: |
    <p><strong>先认词：</strong>这一课会同时讨论“用户怎么进入服务”“服务器怎么访问上游”“长连接为什么会卡”和“Clash 为什么开了 Global 还可能没接管流量”。先把控制位置不同的术语分开，再做综合判断。</p>
    <div class="grid">
      <details><summary>Network Path · 网络路径 / 链路<span class="term-gloss">一个请求从起点到终点实际经过的网络节点与连接段。</span></summary><div class="body"><dl><dt>直觉</dt><dd>不是只看起点和终点，而是看中间到底走了哪条路。</dd><dt>当前案例</dt><dd>大陆直连新加坡与“大陆→香港→新加坡”是两条不同路径，质量必须分别测。</dd><dt>边界</dt><dd>地理距离不能唯一决定网络路径，运营商互联、BGP 路由、拥塞和跨境出口都会改变实际体验。</dd></dl></div></details>
      <details><summary>Ingress / Egress · 入站 / 出站<span class="term-gloss">Ingress 是请求进入服务系统的方向；Egress 是服务访问外部上游的方向。</span></summary><div class="body"><dl><dt>直觉</dt><dd>站在 Sub2API 这个系统里看，用户进来叫 ingress，Sub2API 去找模型上游叫 egress。</dd><dt>当前案例</dt><dd>大陆用户→新加坡是不稳定的 ingress；新加坡→GPT/Claude 是另一条 egress。</dd><dt>边界</dt><dd>给 egress 配代理不会自动改变已经发生在 ingress 上的路由。</dd></dl></div></details>
      <details><summary>Forward Proxy · 前向代理<span class="term-gloss">站在客户端一侧，代表客户端去访问外部目标的代理。</span></summary><div class="body"><dl><dt>直觉</dt><dd>用户先把请求交给自己的代理，再由代理替用户去访问目标。</dd><dt>当前案例</dt><dd>Clash/mihomo 装在个人电脑上时，典型角色就是前向代理。</dd><dt>边界</dt><dd>它解决的是这个客户端自己的出站路径，不会自动改善其他客户。</dd></dl></div></details>
      <details><summary>Reverse Proxy · 反向代理<span class="term-gloss">站在服务端一侧，先接住用户请求，再把请求转给内部源站。</span></summary><div class="body"><dl><dt>直觉</dt><dd>用户以为自己在访问服务本身，实际上先到一个官方前门。</dd><dt>当前案例</dt><dd>香港 Caddy/Nginx 是 <code>ai.rest2build.lol</code> 的前置入口，再转发到新加坡 Sub2API。</dd><dt>边界</dt><dd>反向代理不是数据库副本；它可以无状态，只承担网络接入。</dd></dl></div></details>
      <details><summary>Origin Server · 源站<span class="term-gloss">真正承载业务逻辑和状态、被前置代理转发访问的后端服务。</span></summary><div class="body"><dl><dt>直觉</dt><dd>前门后面真正办事的地方。</dd><dt>当前案例</dt><dd>新加坡 Sub2API 仍是 origin，账号、鉴权、计费、数据库和 Redis 都留在那里。</dd><dt>边界</dt><dd>把 DNS 指向香港并不等于迁移源站。</dd></dl></div></details>
      <details><summary>Round-Trip Time (RTT) · 往返时延<span class="term-gloss">一个网络往返所需的时间，用来观察链路本身的基础延迟。</span></summary><div class="body"><dl><dt>直觉</dt><dd>发一个很小的信号过去再回来，需要多久。</dd><dt>当前案例</dt><dd>用于比较大陆→香港、大陆→新加坡等路径的网络基础成本。</dd><dt>边界</dt><dd>RTT 低不等于 HTTP 首字节一定快，因为服务器处理和上游等待不在纯 RTT 里。</dd></dl></div></details>
      <details><summary>Time to First Byte (TTFB) · 首字节时间<span class="term-gloss">从客户端开始请求，到收到 HTTP 第一个响应字节的总等待时间。</span></summary><div class="body"><dl><dt>严格一点</dt><dd>TTFB 会叠加 DNS、连接、TLS、代理、应用处理和上游等待，因此比 RTT 更接近“用户等多久才看到服务开始响应”。</dd><dt>当前案例</dt><dd>健康接口 TTFB 可用于隔离入口质量，真实模型 TTFB 还包含模型上游首 token 等待。</dd></dl></div></details>
      <details><summary>TLS Termination · TLS 终止<span class="term-gloss">HTTPS 加密连接在某个代理节点结束解密，再由该节点继续转发。</span></summary><div class="body"><dl><dt>直觉</dt><dd>香港入口先和客户端完成 HTTPS 握手，然后再建立到新加坡的受保护连接。</dd><dt>当前案例</dt><dd>证书、SNI 和 443 连接首先由香港入口处理。</dd><dt>边界</dt><dd>TLS 在香港终止意味着香港进程会处理解密后的 HTTP 请求，因此仍需日志脱敏和主机安全。</dd></dl></div></details>
      <details><summary>Server-Sent Events (SSE) · 服务器发送事件<span class="term-gloss">基于长时间 HTTP 响应，由服务器持续向客户端推送小块数据的流式机制。</span></summary><div class="body"><dl><dt>直觉</dt><dd>连接不立刻结束，服务器不断往同一条 HTTP 响应里追加事件。</dd><dt>当前案例</dt><dd>模型 token 流式返回时，代理缓冲或超时会直接影响“字一个个出来”还是“憋一坨才出来”。</dd><dt>边界</dt><dd>SSE 主要是服务器→客户端单向推送，不等同于 WebSocket 的双向消息通道。</dd></dl></div></details>
      <details><summary>WebSocket · WebSocket 双向长连接<span class="term-gloss">从 HTTP 握手升级出的持久双向连接，客户端和服务端都能持续发消息。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>若客户端或上游协议使用 WebSocket，香港反向代理必须正确处理 Upgrade 和长时间连接。</dd><dt>边界</dt><dd>普通 HTTPS 请求成功不能证明 WebSocket 一定能建立和维持。</dd></dl></div></details>
      <details><summary>Proxy Buffering · 代理缓冲<span class="term-gloss">代理先收集一部分上游响应，再批量向客户端发送的行为。</span></summary><div class="body"><dl><dt>直觉</dt><dd>像快递站等包裹攒一车再发；对下载可能有益，对实时 token 流可能造成明显停顿。</dd><dt>当前案例</dt><dd>SSE 路径应验证代理没有把小 chunk 长时间积压。</dd><dt>边界</dt><dd>“关闭缓冲”应针对需要实时流式的接口，不代表整个站点所有响应都必须禁用任何缓存机制。</dd></dl></div></details>
      <details><summary>WireGuard Tunnel · WireGuard 隧道<span class="term-gloss">在两个受控节点之间建立加密三层隧道，把公网传输变成受控的虚拟私有链路。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>香港→新加坡可以走 WireGuard，让新加坡业务端口只对隧道地址开放。</dd><dt>边界</dt><dd>WireGuard 位于香港到新加坡这一段，不会自动改善大陆用户到香港的接入质量；MTU 等配置也需要真实负载测试。</dd></dl></div></details>
      <details><summary>System Proxy · 系统代理<span class="term-gloss">操作系统提供的 HTTP/HTTPS/SOCKS 代理设置，只有遵循这些设置的应用才会使用它。</span></summary><div class="body"><dl><dt>当前案例</dt><dd>Clash 开了 Global 但应用仍直连时，要先确认应用流量是否真的进入系统代理。</dd><dt>边界</dt><dd>某些 UDP、QUIC、自带网络栈或忽略系统代理设置的程序可能绕过这一层。</dd></dl></div></details>
      <details><summary>TUN Interface · TUN 虚拟网络接口<span class="term-gloss">在 IP 层接管较广范围系统流量，再交给代理软件决定直连或转发。</span></summary><div class="body"><dl><dt>直觉</dt><dd>不是等应用主动来找代理，而是在更底层把经过虚拟网卡的包接住。</dd><dt>当前案例</dt><dd>Rule + TUN 常用于让目标服务走代理、国内流量继续直连；Global + TUN 更适合短时间强制诊断。</dd><dt>边界</dt><dd>TUN 覆盖更广但不是“数学意义上的所有流量”，仍受路由、排除项、权限和平台实现约束。</dd></dl></div></details>
    </div>
